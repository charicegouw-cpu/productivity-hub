<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Charice DG — Portofolio</title>
<meta name="description" content="Self-contained portfolio & in-browser CMS. Single-file, Firebase Firestore persistence, SHA-256 auth." />
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js"
  }
}
</script>
<style>
/* ============================================================
   Portfolio CMS — single-file stylesheet (vanilla CSS3)
   Emerald accent · Inter-ish system font stack · responsive
   ============================================================ */
:root {
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  --bg: #f9faf9;
  --bg-2: #ffffff;
  --fg: #1a2330;
  --fg-2: #475063;
  --muted: #6b7280;
  --border: #e6e8ea;
  --border-2: #d6d9dd;
  --card: #ffffff;
  --primary: #0f9d6b;
  --primary-fg: #ffffff;
  --primary-soft: #e8f6ef;
  --primary-soft-2: #d4efdf;
  --accent: #f0fdf4;
  --amber: #d97706;
  --amber-soft: #fef3c7;
  --rose: #e11d48;
  --rose-soft: #ffe4e6;
  --sidebar: #18222e;
  --sidebar-fg: #cdd3dc;
  --sidebar-accent: #232f3d;

  --shadow-sm: 0 1px 2px rgba(20,30,40,.05);
  --shadow: 0 1px 2px rgba(20,30,40,.04), 0 4px 12px rgba(20,30,40,.05);
  --shadow-lg: 0 1px 2px rgba(20,30,40,.05), 0 8px 28px rgba(20,30,40,.08);
  --ring: 0 0 0 3px rgba(15,157,107,.25);

  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; display: block; }
ul { list-style: none; margin: 0; padding: 0; }
::selection { background: #c6ecd8; color: #0a3d2a; }

/* Scrollbar */
.scroll-thin { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll-thin::-webkit-scrollbar-track { background: transparent; }
.scroll-thin::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

/* Layout helpers */
.container { max-width: 1152px; margin: 0 auto; padding: 0 16px; }
.container-sm { max-width: 720px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 640px) { .container, .container-sm { padding: 0 24px; } }
@media (min-width: 1024px) { .container, .container-sm { padding: 0 32px; } }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 40px; padding: 0 16px; border-radius: 999px;
  border: 1px solid transparent; background: var(--primary); color: var(--primary-fg);
  font-weight: 600; font-size: 14px; transition: all .18s ease;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.btn:active { transform: translateY(0); }
.btn-lg { height: 44px; padding: 0 24px; font-size: 15px; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn-icon { width: 40px; padding: 0; border-radius: 10px; }
.btn-outline { background: var(--card); color: var(--fg); border-color: var(--border); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--bg); color: var(--fg); transform: none; box-shadow: none; }
.btn-danger { background: var(--rose); }
.btn-danger:hover { background: #be123c; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn .icon { width: 16px; height: 16px; }

/* Inputs */
.field-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--fg); }
.input, .textarea {
  width: 100%; border: 1px solid var(--border); background: var(--bg-2);
  border-radius: var(--radius-sm); padding: 10px 12px; font: inherit; color: var(--fg);
  transition: border-color .15s, box-shadow .15s; outline: none;
}
.input:focus, .textarea:focus { border-color: var(--primary); box-shadow: var(--ring); }
.textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
.input::placeholder, .textarea::placeholder { color: #9aa3b0; }
.input-h { height: 40px; }

/* Badges / chips */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--bg); color: var(--fg-2); border: 1px solid var(--border); }
.badge-primary { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.badge-amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--bg); color: var(--fg); border: 1px solid var(--border); }
.chip .x { cursor: pointer; opacity: .6; }
.chip .x:hover { opacity: 1; }

/* Card */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.card-pad { padding: 20px; }
@media (min-width: 640px) { .card-pad { padding: 24px; } }
.card-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
.card-desc { font-size: 13px; color: var(--muted); margin: 0; }

/* Switch */
.switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .track { width: 38px; height: 22px; border-radius: 999px; background: var(--border-2); transition: background .18s; position: relative; }
.switch .thumb { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 999px; background: #fff; box-shadow: var(--shadow-sm); transition: transform .18s; }
.switch input:checked + .track { background: var(--primary); }
.switch input:checked + .track .thumb { transform: translateX(16px); }

/* App root layout */
#app { min-height: 100vh; display: flex; flex-direction: column; }

/* ============ NAVBAR ============ */
.navbar { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid transparent; background: rgba(249,250,249,.8); backdrop-filter: blur(12px); transition: all .3s; }
.navbar.scrolled { border-color: var(--border); box-shadow: var(--shadow); background: rgba(255,255,255,.85); }
.nav-inner { max-width: 1152px; margin: 0 auto; padding: 0 16px; height: 64px; display: flex; align-items: center; gap: 16px; }
@media (min-width: 640px) { .nav-inner { padding: 0 24px; } }
@media (min-width: 1024px) { .nav-inner { padding: 0 32px; } }
.brand { display: inline-flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--primary); color: var(--primary-fg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; box-shadow: var(--shadow-sm); }
.brand-text { display: flex; flex-direction: column; line-height: 1; }
.brand-text .name { font-size: 14px; font-weight: 700; }
.brand-text .kicker { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nav-links { display: none; align-items: center; gap: 4px; margin: 0 auto; }
@media (min-width: 768px) { .nav-links { display: flex; } }
.nav-link { padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--fg-2); transition: all .15s; }
.nav-link:hover { background: var(--bg); color: var(--fg); }
.nav-cta { display: none; }
@media (min-width: 768px) { .nav-cta { display: inline-flex; } }
.nav-toggle { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent; color: var(--fg); }
.nav-toggle:hover { background: var(--bg); }
@media (min-width: 768px) { .nav-toggle { display: none; } }
/* Admin login button — right side, user placeholder icon */
.nav-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
@media (min-width: 768px) { .nav-actions { margin-left: 0; } }
.nav-admin { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--fg-2); transition: all .18s; box-shadow: var(--shadow-sm); flex-shrink: 0; }
.nav-admin:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); transform: translateY(-1px); }
.nav-admin.is-admin { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.nav-admin.is-admin:hover { background: #0c8a5e; }
.nav-drawer { border-top: 1px solid var(--border); background: var(--bg-2); }
.nav-drawer-inner { max-width: 1152px; margin: 0 auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
@media (min-width: 768px) { .nav-drawer { display: none; } }
.nav-drawer-link { padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--fg-2); }
.nav-drawer-link:hover { background: var(--bg); }

/* ============ HERO (split design) ============ */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
.hero-glow { position: absolute; inset: 0; pointer-events: none; }
.hero-glow::before { content: ""; position: absolute; inset: -6rem 0 auto 0; height: 18rem; background: rgba(15,157,107,.06); filter: blur(64px); }
.hero-glow::after { content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 10rem; width: 36rem; max-width: 90%; border-radius: 999px; background: rgba(15,157,107,.04); filter: blur(64px); }
.hero-inner { position: relative; max-width: 1152px; margin: 0 auto; padding: 48px 16px; }
@media (min-width: 640px) { .hero-inner { padding: 64px 24px; } }
@media (min-width: 1024px) { .hero-inner { padding: 80px 32px; } }
.hero-grid { display: grid; gap: 32px; align-items: center; }
@media (min-width: 1024px) { .hero-grid { grid-template-columns: 1fr 1.4fr; gap: 48px; } }
.hero-visual { display: flex; flex-direction: column; align-items: center; }
@media (min-width: 1024px) { .hero-visual { align-items: flex-start; } }
.avatar-wrap { position: relative; }
.avatar { width: 160px; height: 160px; border-radius: 24px; object-fit: cover; box-shadow: var(--shadow-lg); border: 1px solid var(--border); background: var(--primary-soft); }
@media (min-width: 640px) { .avatar { width: 192px; height: 192px; } }
.avatar-ring { position: absolute; inset: -4px; border-radius: 28px; border: 1px solid rgba(15,157,107,.2); }
.avatar-square { position: absolute; inset: -12px; border-radius: 32px; background: rgba(15,157,107,.05); transform: rotate(3deg); z-index: -1; }
.avatar-badge { position: absolute; bottom: -12px; right: -12px; display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px; box-shadow: var(--shadow-lg); font-size: 12px; font-weight: 600; }
.dot-pulse { position: relative; display: inline-flex; width: 8px; height: 8px; }
.dot-pulse::before { content: ""; position: absolute; inset: 0; border-radius: 999px; background: var(--primary); animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite; opacity: .6; }
.dot-pulse::after { content: ""; position: relative; display: inline-flex; width: 8px; height: 8px; border-radius: 999px; background: var(--primary); }
@keyframes ping { 75%,100% { transform: scale(2.2); opacity: 0; } }
.hero-stats { margin-top: 24px; display: none; align-items: center; gap: 20px; }
@media (min-width: 1024px) { .hero-stats { display: flex; } }
.stat-divider { width: 1px; height: 32px; background: var(--border); }
.stat { display: flex; align-items: center; gap: 8px; }
.stat-ic { width: 32px; height: 32px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; }
.stat-val { font-size: 16px; font-weight: 700; line-height: 1.1; }
.stat-lbl { font-size: 11px; color: var(--muted); }
.hero-id { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; }
@media (min-width: 1024px) { .hero-id { align-items: flex-start; text-align: left; } }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: rgba(255,255,255,.7); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); box-shadow: var(--shadow-sm); }
.hero-name { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; margin: 0; }
@media (min-width: 640px) { .hero-name { font-size: 48px; } }
@media (min-width: 1024px) { .hero-name { font-size: 60px; } }
.hero-title { font-size: 18px; font-weight: 600; color: var(--primary); margin: 0; }
@media (min-width: 640px) { .hero-title { font-size: 20px; } }
.hero-quote { position: relative; max-width: 560px; border-left: 2px solid rgba(15,157,107,.4); padding: 4px 0 4px 16px; margin: 0; }
.hero-quote p { font-size: 16px; line-height: 1.6; color: var(--fg); font-style: italic; margin: 0; }
@media (min-width: 640px) { .hero-quote p { font-size: 18px; } }
.hero-bio { font-size: 14px; color: var(--muted); max-width: 560px; line-height: 1.7; margin: 0; }
@media (min-width: 640px) { .hero-bio { font-size: 16px; } }
.social-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
@media (min-width: 1024px) { .social-row { justify-content: flex-start; } }
.social-link { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 14px; font-weight: 500; color: var(--fg); transition: all .18s; box-shadow: var(--shadow-sm); }
.social-link:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); transform: translateY(-2px); }
.hero-cta-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
@media (min-width: 1024px) { .hero-cta-row { justify-content: flex-start; } }
.hero-stats-mobile { margin-top: 40px; display: flex; align-items: center; justify-content: center; gap: 24px; }
@media (min-width: 1024px) { .hero-stats-mobile { display: none; } }

/* ============ SECTIONS ============ */
.section { max-width: 1152px; margin: 0 auto; padding: 48px 16px; scroll-margin-top: 80px; }
@media (min-width: 640px) { .section { padding: 64px 24px; } }
@media (min-width: 1024px) { .section { padding: 64px 32px; } }
.section-head { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 40px; }
@media (min-width: 640px) { .section-head { margin-bottom: 48px; } }
.eyebrow { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--primary); margin-bottom: 16px; }
.eyebrow .line { height: 1px; width: 32px; background: rgba(15,157,107,.4); }
.section-title { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
@media (min-width: 640px) { .section-title { font-size: 36px; } }
.section-sub { font-size: 15px; color: var(--muted); max-width: 560px; line-height: 1.6; margin: 12px 0 0; }
@media (min-width: 640px) { .section-sub { font-size: 16px; } }
.section-count { margin-top: 16px; }

/* Project grid */
.proj-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 768px) { .proj-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; } }
.proj-card { display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow); transition: all .3s; }
.proj-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: rgba(15,157,107,.3); }
.proj-thumb { position: relative; aspect-ratio: 16/10; overflow: hidden; background: var(--bg); }
.proj-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
.proj-card:hover .proj-thumb img { transform: scale(1.04); }
.proj-featured { position: absolute; left: 12px; top: 12px; }
.proj-body { display: flex; flex-direction: column; flex: 1; padding: 20px; }
.proj-title { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.proj-desc { margin: 6px 0 0; font-size: 14px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.proj-tags { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; border-radius: 6px; background: var(--bg); padding: 2px 8px; font-size: 12px; font-weight: 500; color: var(--fg-2); }
.proj-foot { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.proj-link { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
.proj-link.demo { color: var(--primary); }
.proj-link.demo:hover { background: var(--primary-soft); }
.proj-link.repo { color: var(--fg-2); }
.proj-link.repo:hover { background: var(--bg); }
.proj-date { margin-left: auto; font-size: 11px; color: var(--muted); }
.proj-empty { border: 2px dashed var(--border); border-radius: var(--radius-lg); background: rgba(255,255,255,.5); padding: 40px; text-align: center; color: var(--muted); }

/* Pagination */
.pagination { margin-top: 32px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
@media (min-width: 640px) { .pagination { flex-direction: row; justify-content: center; } }
.pagination-controls { display: flex; align-items: center; gap: 8px; }
.page-dots { display: flex; align-items: center; gap: 6px; padding: 0 4px; }
.page-dot { height: 8px; width: 8px; border-radius: 999px; background: var(--border-2); border: none; padding: 0; transition: all .2s; }
.page-dot:hover { background: var(--muted); }
.page-dot.active { width: 24px; background: var(--primary); }
.pagination-info { font-size: 12px; color: var(--muted); }

/* Skills */
.skills-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 640px) { .skills-grid { grid-template-columns: 1fr 1fr; gap: 24px; } }
.skill-card { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); padding: 20px 24px; box-shadow: var(--shadow); transition: all .2s; }
.skill-card:hover { box-shadow: var(--shadow-lg); border-color: rgba(15,157,107,.3); }
.skill-cat { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--primary); margin: 0; }
.skill-chips { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
.skill-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg-2); padding: 6px 10px; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all .15s; }
.skill-chip:hover { border-color: var(--primary); color: var(--primary); }

/* Experience timeline */
.timeline { position: relative; border-left: 1px solid var(--border); padding-left: 24px; margin-left: 4px; display: flex; flex-direction: column; gap: 32px; }
@media (min-width: 640px) { .timeline { padding-left: 32px; } }
.timeline-item { position: relative; }
.timeline-dot { position: absolute; left: -29px; top: 4px; width: 16px; height: 16px; border-radius: 999px; border: 2px solid var(--bg); background: rgba(107,114,128,.4); }
@media (min-width: 640px) { .timeline-dot { left: -37px; } }
.timeline-dot.current { background: var(--primary); box-shadow: var(--shadow); }
.timeline-dot.current::after { content: ""; position: absolute; inset: -2px; border-radius: 999px; background: var(--primary); opacity: .4; animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite; }
.exp-card { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); padding: 20px 24px; box-shadow: var(--shadow); transition: all .2s; }
.exp-card:hover { box-shadow: var(--shadow-lg); border-color: rgba(15,157,107,.3); }
.exp-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; }
.exp-role { font-size: 16px; font-weight: 600; margin: 0; }
.exp-period { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
.exp-company { margin: 2px 0 0; font-size: 14px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 8px; }
.exp-current { display: inline-flex; align-items: center; border-radius: 999px; background: var(--primary-soft); color: var(--primary); padding: 2px 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.exp-desc { margin: 12px 0 0; font-size: 14px; color: var(--muted); line-height: 1.6; }

/* Contact */
.contact-card { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: 24px; background: linear-gradient(135deg, var(--card), var(--primary-soft)); padding: 32px 40px; box-shadow: var(--shadow-lg); }
@media (min-width: 640px) { .contact-card { padding: 48px; } }
.contact-glow { position: absolute; top: -4rem; right: -2.5rem; width: 12rem; height: 12rem; border-radius: 999px; background: rgba(15,157,107,.15); filter: blur(64px); }
.contact-body { position: relative; max-width: 560px; }
.contact-cta { font-size: 14px; font-weight: 500; color: var(--primary); margin: 0 0 16px; }
.contact-actions { display: flex; flex-wrap: gap: 12px; }
.contact-blurb { margin-top: 20px; font-size: 14px; color: var(--muted); line-height: 1.6; }

/* Footer */
.footer { margin-top: auto; border-top: 1px solid var(--border); background: rgba(255,255,255,.4); }

async function sha256(text) {
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest("SHA-256", enc.encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");

async function saveToFirestore(d) {

      const legacyRaw = localStorage.getItem(STORAGE_KEY);

      if (activeTag === "INPUT" || activeTag === "TEXTAREA") return;
      state.data = heal(remoteData);

function heal(p) {
  return {
    auth: { username: p?.auth?.username ?? DEFAULT_USERNAME, passwordHash: p?.auth?.passwordHash ?? "0".repeat(64) },
    profile: { ...DEFAULT_PROFILE, ...(p?.profile ?? {}) },
    projects: Array.isArray(p?.projects) ? p.projects : DEFAULT_PROJECTS,
    navbar: {
      brand: p?.navbar?.brand ?? DEFAULT_NAVBAR.brand,
      showBrand: typeof p?.navbar?.showBrand === "boolean" ? p.navbar.showBrand : true,

    },

    experience: Array.isArray(p?.experience) && p.experience.length ? p.experience : DEFAULT_EXPERIENCE,
    sections: {

}

  if (lock) out.enabled = true;

}

/* ---------- Toast ---------- */
function toast(title, desc, kind) {
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.style.pointerEvents = "auto";
  el.innerHTML = `<div class="t-title">${esc(title)}</div>${desc ? `<div class="t-desc">${esc(desc)}</div>` : ""}`;
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(() => el.remove(), 300); }, 2800);
}

function initials(name) { const p = (name||"").trim().split(/\s+/).filter(Boolean); return p.length ? p.length===1 ? p[0].slice(0,2).toUpperCase() : (p[0][0]+p[p.length-1][0]).toUpperCase() : "?"; }
function formatDate(iso) { try { return new Date(iso).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}); } catch { return iso; } }

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render() {
  const app = document.getElementById("app");
  if (!state.data) {
    app.innerHTML = '<div class="loading"><div class="loading-mark" style="position:relative;">' + icon("sparkles").replace('width="14"','width="24"').replace('height="14"','height="24"') + '</div><p class="text-muted text-sm fade-in">Loading portfolio…</p></div>';
    return;
  }
  if (state.view === "admin" && state.isAdmin) {
    app.innerHTML = renderAdmin();
    bindAdmin();
  } else {
    app.innerHTML = renderPublic();
    bindPublic();
  }
  renderFab();
}

/* ============================================================
   PUBLIC SITE
   ============================================================ */
function renderPublic() {
  const d = state.data;
  const s = d.sections;
  let html = '<div id="app-public" class="flex flex-col" style="min-height:100vh;">';
  html += renderNavbar(d);
  html += '<main style="flex:1;">';
  if (s.hero.enabled) html += renderHero(d);
  if (s.projects.enabled) html += renderProjects(d, s.projects);
  if (s.skills.enabled) html += renderSkills(d, s.skills);
  if (s.experience.enabled) html += renderExperience(d, s.experience);
  if (s.contact.enabled) html += renderContact(d, s.contact);
  html += '</main>';
  html += renderFooter(d);
  html += '</div>';
  return html;
}

function renderNavbar(d) {
  const nb = d?.navbar || DEFAULT_NAVBAR;
  const adminCls = state.isAdmin ? " is-admin" : "";
  const adminTitle = state.isAdmin ? "Back to Admin Panel" : "Admin login (or press Ctrl+Shift+A)";
  let html = '<header class="navbar" id="navbar"><div class="nav-inner">';

function renderProjects(d, cfg) {
  const featured = d.projects.filter(p=>p.featured);

  const totalPages = Math.max(1, Math.ceil(ordered.length / PROJECTS_PER_PAGE));
  const page = Math.min(state.projectPage, totalPages);
  const start = (page-1)*PROJECTS_PER_PAGE;
  const items = ordered.slice(start, start+PROJECTS_PER_PAGE);
  let html = `<section class="section" id="projects"><div class="section-head">`;
  if (cfg.eyebrow) html += `<div class="eyebrow"><span class="line"></span>${esc(cfg.eyebrow)}<span class="line"></span></div>`;

function bindPublic() {
  // Navbar scroll state
  const nb = document.getElementById("navbar");
  const onScroll = () => { if (window.scrollY > 8) nb.classList.add("scrolled"); else nb.classList.remove("scrolled"); };
  onScroll(); window.addEventListener("scroll", onScroll, { passive: true });
  // Mobile drawer
  const toggle = document.getElementById("navToggle");
  const drawer = document.getElementById("navDrawer");
  if (toggle) toggle.onclick = () => drawer.classList.toggle("hidden");
  document.querySelectorAll("[data-close-drawer]").forEach(a => a.addEventListener("click", () => drawer.classList.add("hidden")));
  // CTA scroll
  const cta = document.getElementById("ctaProjects");
  if (cta) cta.onclick = () => document.getElementById("projects")?.scrollIntoView({ behavior: "smooth", block: "start" });
  // Admin buttons (footer + navbar)
  const ab = document.getElementById("adminBtn");
  if (ab) ab.onclick = openLogin;
  const nab = document.getElementById("navAdmin");
  if (nab) nab.onclick = () => {
    if (state.isAdmin) { state.view = "admin"; render(); }
    else openLogin();
  };
  // Pagination
  document.querySelectorAll("[data-page]").forEach(b => b.addEventListener("click", (e) => {
    const v = e.currentTarget.getAttribute("data-page");
    const totalPages = Math.max(1, Math.ceil(orderedProjects().length / PROJECTS_PER_PAGE));
    let next = state.projectPage;
    if (v === "prev") next = Math.max(1, state.projectPage-1);
    else if (v === "next") next = Math.min(totalPages, state.projectPage+1);
    else next = parseInt(v,10);
    state.projectPage = next;
    document.getElementById("projects")?.scrollIntoView({ behavior: "smooth", block: "start" });
    render();
  }));
  // Back to top FAB
  let fabTop = document.getElementById("fabTop");
  if (!fabTop) {
    fabTop = document.createElement("button"); fabTop.id = "fabTop"; fabTop.className = "fab-top"; fabTop.innerHTML = icon("arrowUp");
    fabTop.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
    document.body.appendChild(fabTop);
  }
  window.addEventListener("scroll", () => { fabTop.style.display = window.scrollY > 600 ? "flex" : "none"; }, { passive: true });
}
function orderedProjects() { const f = state.data.projects.filter(p=>p.featured), o = state.data.projects.filter(p=>!p.featured); return [...f, ...o]; }

function openLogin() {
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-overlay" id="loginOverlay">
    <div class="modal" style="position:relative;">
      <button class="modal-close" id="loginClose">${icon("x")}</button>
      <div class="modal-head" style="padding-top:24px;">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:4px;">${icon("lock").replace('width="14"','width="20"').replace('height="14"','height="20"')}</div>
        <h2 class="modal-title">Admin Access</h2>
        <p class="modal-desc">Masukkan kredensial untuk mengelola portofolio. Terverifikasi via SHA-256 (Web Crypto API).</p>
      </div>
      <form class="modal-body" id="loginForm">
        <div class="mb-3"><label class="field-label">Username</label><input class="input input-h" id="loginUser" placeholder="username" autocomplete="username" required autofocus></div>
        <div><label class="field-label">Password</label>
          <div style="position:relative;">
            <input class="input input-h" id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" required style="padding-right:40px;">
            <button type="button" id="loginToggle" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);display:flex;">${icon("eye")}</button>
          </div>
        </div>
        <p class="text-danger text-sm hidden" id="loginErr"></p>
        <button class="btn w-full mt-4" type="submit" id="loginSubmit">${icon("shield")}Sign in</button>
        <p class="text-center text-muted" style="font-size:12px;margin-top:12px;">Tip: gunakan kredensial default yang dikonfigurasi saat pertama dijalankan.</p>
      </form>
    </div></div>`;
  document.getElementById("loginClose").onclick = closeLogin;
  document.getElementById("loginOverlay").addEventListener("click", (e) => { if (e.target.id === "loginOverlay") closeLogin(); });
  document.getElementById("loginToggle").onclick = () => {
    const ip = document.getElementById("loginPass");
    ip.type = ip.type === "password" ? "text" : "password";
  };
  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    const u = document.getElementById("loginUser").value;
    const p = document.getElementById("loginPass").value;
    const btn = document.getElementById("loginSubmit");
    btn.disabled = true; btn.innerHTML = "Verifying…";
    const ok = await doLogin(u, p);
    if (!ok) {
      btn.disabled = false; btn.innerHTML = icon("shield") + "Sign in";
      const err = document.getElementById("loginErr");
      err.textContent = "Username or password is incorrect.";
      err.classList.remove("hidden");
    }
  };
}
function closeLogin() { document.getElementById("modal-root").innerHTML = ""; }
async function doLogin(u, p) {
  try {
    const hash = await sha256(p);
    if (state.data.auth && u.trim() === state.data.auth.username && hash === state.data.auth.passwordHash) {
      state.isAdmin = true; writeSession(true); state.view = "admin"; state.adminTab = "overview";
      closeLogin(); render(); toast("Welcome back", `Signed in as ${state.data.auth.username}.`, "success");
      return true;
    }
    return false;
  } catch { return false; }
}

function viewOverview() {
  const d = state.data;
  const storageBytes = new Blob([JSON.stringify(d)]).size;
  const featuredCount = d.projects.filter(p=>p.featured).length;
  const enabledSections = Object.values(d.sections).filter(s=>s.enabled).length;

function systemStatus(d, bytes, navLinks, lastTs) {

    { heading: "Security", icon: "shield", rows: [["Auth hashing","SHA-256"],["Provider","crypto.subtle"],["Session store","sessionStorage"],["Session scope","per-tab"]] },
    { heading: "Content", icon: "layers", rows: [["Nav links",String(navLinks)],["Last update",lastTs?new Date(lastTs).toLocaleDateString("en-US",{month:"short",day:"numeric"}):"—"],["Mode","offline-first"],["Dependencies","0 external"]] },

let editingProject = null;
function openProjectForm(project) {
  editingProject = project ? { ...project } : { title:"", description:"", tags:[], imageUrl:"", demoUrl:"", repoUrl:"", featured:false };
  const p = editingProject;
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-overlay" id="projOverlay">

      <button class="modal-close" id="projClose">${icon("x")}</button>
      <div class="modal-head" style="padding-top:24px;"><h2 class="modal-title">${project?"Edit project":"Add new project"}</h2><p class="modal-desc">${project?"Update the details below. Changes save to Firestore instantly.":"Fill in the details for your new project card."}</p></div>
      <div class="modal-body">
        <div class="grid-2 mb-4" style="align-items:start;">
          <div><label class="field-label">Thumbnail URL</label><input class="input input-h" id="pf2Image" value="${esc(p.imageUrl)}" placeholder="https://…"></div>
          <div><label class="field-label">Preview</label><div style="height:88px;width:140px;overflow:hidden;border-radius:8px;border:1px solid var(--border);background:var(--bg);">${p.imageUrl?`<img src="${esc(p.imageUrl)}" style="width:100%;height:100%;object-fit:cover;">`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);">${icon("sparkles")}</div>`}</div></div>
        </div>
        <div class="mb-4"><label class="field-label">Title *</label><input class="input input-h" id="pf2Title" value="${esc(p.title)}" placeholder="Project title"></div>
        <div class="mb-4"><label class="field-label">Description *</label><textarea class="textarea" id="pf2Desc" rows="3" placeholder="A short summary.">${esc(p.description)}</textarea></div>
        <div class="mb-4"><label class="field-label">Tech stack / tags</label><div class="tag-input-wrap" id="pf2TagsWrap"></div><p class="text-muted" style="font-size:12px;margin-top:6px;">Press Enter or comma to add. Backspace removes the last tag.</p></div>
        <div class="grid-2 mb-4"><div><label class="field-label">Demo URL</label><input class="input input-h" id="pf2Demo" value="${esc(p.demoUrl)}" placeholder="https://…"></div><div><label class="field-label">Repository URL</label><input class="input input-h" id="pf2Repo" value="${esc(p.repoUrl)}" placeholder="https://github.com/…"></div></div>
        <div class="flex justify-between items-center" style="border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:12px 16px;"><div><label class="field-label" style="margin:0;cursor:pointer;" for="pf2Feat">Featured project</label><p class="text-muted" style="font-size:12px;">Featured projects appear first.</p></div><label class="switch"><input type="checkbox" id="pf2Feat" ${p.featured?"checked":""}><span class="track"><span class="thumb"></span></span></label></div>
      </div>
      <div class="modal-foot"><button class="btn btn-outline" id="projCancel">Cancel</button><button class="btn" id="projSave">${icon("plus").replace('width="16"','width="16"').replace('height="16"','height="16"')}${project?"Save changes":"Add project"}</button></div>
    </div></div>`;
  document.getElementById("projClose").onclick = closeProjectForm;
  document.getElementById("projCancel").onclick = closeProjectForm;
  document.getElementById("projOverlay").addEventListener("click", (e) => { if (e.target.id==="projOverlay") closeProjectForm(); });
  // Tag input
  const tagsWrap = document.getElementById("pf2TagsWrap");
  const tagInput = document.createElement("input"); tagInput.placeholder = p.tags.length ? "" : "Type a tag, press Enter…"; tagInput.style.height = "28px";
  function renderTags() {
    [...tagsWrap.querySelectorAll(".chip")].forEach(c => c.remove());
    p.tags.forEach((t,idx) => {
      const chip = document.createElement("span"); chip.className = "chip"; chip.innerHTML = `${esc(t)}<span class="x" data-idx="${idx}">${icon("x").replace('width="20"','width="12"').replace('height="20"','height="12"')}</span>`;
      tagsWrap.insertBefore(chip, tagInput);
      chip.querySelector(".x").onclick = () => { p.tags.splice(idx,1); renderTags(); };
    });
  }
  tagInput.onkeydown = (e) => {
    if (e.key==="Enter" || e.key===",") { e.preventDefault(); const v = tagInput.value.trim(); if (v && !p.tags.includes(v)) { p.tags.push(v); renderTags(); } tagInput.value=""; }
    else if (e.key==="Backspace" && !tagInput.value && p.tags.length) { p.tags.pop(); renderTags(); }
  };
  tagInput.onblur = () => { const v = tagInput.value.trim(); if (v && !p.tags.includes(v)) { p.tags.push(v); renderTags(); } tagInput.value=""; };
  tagsWrap.appendChild(tagInput);
  renderTags();
  // Image live preview
  document.getElementById("pf2Image").oninput = (e) => {
    const url = e.target.value;
    const prev = e.target.closest(".grid-2").querySelector("div > div > div > img, div > div > div > div");
    const container = e.target.closest(".grid-2").children[1].querySelector("div[style*='height:88px']");
    if (container) { container.innerHTML = url ? `<img src="${esc(url)}" style="width:100%;height:100%;object-fit:cover;">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);">${icon("sparkles")}</div>`; }
  };
  document.getElementById("projSave").onclick = () => {
    const title = document.getElementById("pf2Title").value.trim();
    const desc = document.getElementById("pf2Desc").value.trim();
    if (!title) { toast("Title is required", "", "error"); return; }
    if (!desc) { toast("Description is required", "", "error"); return; }
    const patch = { title, description: desc, tags: p.tags, imageUrl: document.getElementById("pf2Image").value.trim(), demoUrl: document.getElementById("pf2Demo").value.trim(), repoUrl: document.getElementById("pf2Repo").value.trim(), featured: document.getElementById("pf2Feat").checked };
    if (project) { Object.assign(findProject(project.id), patch); toast("Project updated", title, "success"); }
    else { state.data.projects.unshift({ id: genId("proj"), createdAt: new Date().toISOString(), ...patch }); toast("Project added", title, "success"); }
    writeDataImmediate(state.data); closeProjectForm(); render();
  };
}

  if (!state.data.experience.length) { html += '<div class="card card-pad" style="text-align:center;"><p class="text-muted">No experience entries yet.</p></div>'; return html; }
  state.data.experience.forEach(e => {
    html += `<div class="card card-pad mb-4"><div class="flex items-center gap-3 mb-3"><span class="stat-ic">${icon("briefcase")}</span><input class="input input-h font-medium" value="${esc(e.role)}" data-ex-role="${e.id}" placeholder="Role title"><button class="btn-icon btn-ghost" data-ex-del="${e.id}" style="color:var(--rose);">${icon("trash")}</button></div><div class="grid-2 mb-4"><div><label class="field-label">Company</label><input class="input input-h" value="${esc(e.company)}" data-ex-company="${e.id}"></div><div><label class="field-label">Period</label><input class="input input-h" value="${esc(e.period)}" data-ex-period="${e.id}" placeholder="2022 — Present"></div></div><div class="mb-4"><label class="field-label">Description</label><textarea class="textarea" rows="3" data-ex-desc="${e.id}">${esc(e.description)}</textarea></div>${toggleRow("ex-cur-"+e.id, "Current role", "Highlights with a live pulse on the timeline.", !!e.current)}</div>`;
  });
  return html;
}

/* ---------- Sections editor ---------- */
const SECTION_META = [
  { key:"hero", label:"Hero", hint:"Always enabled — the landing anchor.", lock:true },
  { key:"skills", label:"Skills", hint:"Tech stack grid." },
  { key:"projects", label:"Projects", hint:"Showcase of your work." },
  { key:"experience", label:"Experience", hint:"Career timeline." },
  { key:"contact", label:"Contact", hint:"Final call-to-action." },
];
function viewSections() {
  const s = state.data.sections;
  let html = '<div class="mb-4"><h2 class="font-bold" style="font-size:18px;">Sections</h2><p class="text-muted text-sm">Toggle sections on/off and customise their headings. Hero is always on.</p></div>';
  SECTION_META.forEach(m => {
    const cfg = s[m.key];
    html += `<div class="card card-pad mb-4"><div class="flex justify-between items-start gap-3"><div><h3 class="card-title flex items-center gap-2">${m.label}${m.lock?'<span class="badge">locked</span>':''}</h3><p class="card-desc">${m.hint}</p></div>${toggleRowRow("sec-en-"+m.key, "Enabled", cfg.enabled, m.lock)}</div>`;
    if (cfg.enabled && !m.lock) {
      html += '<div class="mt-4" style="border-top:1px solid var(--border);padding-top:16px;">';
      html += `<div class="mb-3"><label class="field-label">Eyebrow / kicker</label><input class="input input-h" value="${esc(cfg.eyebrow)}" data-sec-eyebrow="${m.key}" placeholder="e.g. Selected Work"></div>`;
      html += `<div class="mb-3"><label class="field-label">Title</label><input class="input input-h" value="${esc(cfg.title)}" data-sec-title="${m.key}" placeholder="Section heading"></div>`;
      html += `<div><label class="field-label">Subtitle</label><textarea class="textarea" rows="2" data-sec-subtitle="${m.key}">${esc(cfg.subtitle)}</textarea></div></div>`;
    }
    html += '</div>';
  });
  // Contact content
  const c = state.data.contact;
  html += '<div class="card card-pad mb-4"><h3 class="card-title flex items-center gap-2">'+icon("mail")+'Contact block content</h3><p class="card-desc">Falls back to your social email when empty.</p><div class="mt-4">';
  html += '<div class="grid-2 mb-4"><div><label class="field-label">Email</label><input class="input input-h" id="ctEmail" value="'+esc(c.email)+'"></div><div><label class="field-label">Phone</label><input class="input input-h" id="ctPhone" value="'+esc(c.phone)+'"></div></div>';
  html += '<div class="mb-4"><label class="field-label">Call-to-action line</label><input class="input input-h" id="ctCta" value="'+esc(c.cta)+'"></div>';
  html += '<div><label class="field-label">Secondary blurb</label><textarea class="textarea" rows="2" id="ctBlurb">'+esc(c.blurb)+'</textarea></div></div></div>';
  return html;
}
function toggleRowRow(id, label, checked, disabled) {
  return `<label class="flex items-center gap-3" style="${disabled?"opacity:.6;cursor:default;":"cursor:pointer;"}"><span class="switch"><input type="checkbox" id="${id}" ${checked?"checked":""} ${disabled?"disabled":""}><span class="track"><span class="thumb"></span></span></span><span class="text-sm font-medium">${label}</span></label>`;
}

/* ---------- Settings ---------- */
function viewSettings() {
  const d = state.data;
  let html = '<div class="mb-4"><h2 class="font-bold" style="font-size:18px;">Settings</h2><p class="text-muted text-sm">Security, data backup, and maintenance.</p></div>';
  // Credentials
  html += '<div class="card card-pad mb-4"><h3 class="card-title flex items-center gap-2">'+icon("lock")+'Change credentials</h3><p class="card-desc">Current username: <strong>'+esc(d.auth.username)+'</strong>. Password stored as SHA-256 hash.</p><form class="mt-4" id="credForm">';
  html += '<div class="mb-3"><label class="field-label">New username</label><input class="input input-h" id="setUser" placeholder="'+esc(d.auth.username)+'" required></div>';
  html += '<div class="grid-2 mb-3"><div><label class="field-label">New password</label><input class="input input-h" type="password" id="setPass" placeholder="At least 4 characters" required></div><div><label class="field-label">Confirm password</label><input class="input input-h" type="password" id="setConfirm" placeholder="Repeat password" required></div></div>';
  html += '<button class="btn" type="submit" id="setSaveCreds">'+icon("lock")+'Update credentials</button></form></div>';
  // Backup
  html += '<div class="card card-pad mb-4"><h3 class="card-title flex items-center gap-2">'+icon("db")+'Data backup &amp; restore</h3><p class="card-desc">Export your entire portfolio as JSON, or restore from a backup.</p><div class="grid-2 mt-4"><button class="btn btn-outline" id="setExport">'+icon("download")+'Export JSON</button><button class="btn btn-outline" id="setImport">'+icon("upload")+'Import JSON</button></div><input type="file" id="setFile" accept="application/json,.json" class="hidden"><p class="text-muted" style="font-size:12px;margin-top:12px;">Import replaces all current data. Exported files include your hashed password — keep them private.</p></div>';
  // Reset
  html += '<div class="card card-pad mb-4" style="border-color:rgba(225,29,72,.3);background:rgba(255,228,230,.4);"><h3 class="card-title flex items-center gap-2 text-danger">'+icon("reset")+'Reset to defaults</h3><p class="card-desc">Erase all Firestore data and restore factory content.</p><div class="mt-4"><button class="btn btn-danger" id="setReset">'+icon("reset")+'Reset everything</button></div></div>';
  // About
  html += '<div class="card card-pad"><h3 class="card-title flex items-center gap-2">'+icon("info")+'About this build</h3><div class="mt-2">';
  html += '<div class="status-row"><span class="l">App</span><span class="v">Portfolio CMS · single-file</span></div>';
  html += '<div class="status-row"><span class="l">Schema</span><span class="v">v'+d.schemaVersion+'</span></div>';
  html += '<div class="status-row"><span class="l">Storage engine</span><span class="v">Firebase Firestore</span></div>';
  html += '<div class="status-row"><span class="l">Crypto</span><span class="v">SHA-256 via crypto.subtle</span></div>';
  html += '</div></div>';
  return html;
}

/* ============================================================
   ADMIN BINDINGS
   ============================================================ */
function bindAdmin() {
  // Tab nav
  document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { state.adminTab = b.getAttribute("data-tab"); render(); }));
  // Preview / logout
  const goPreview = () => { state.view = "public"; render(); };
  const doLogout = () => { state.isAdmin = false; writeSession(false); state.view = "public"; toast("Signed out", "Session cleared."); render(); };
  document.getElementById("sbPreview")?.addEventListener("click", goPreview);
  document.getElementById("sbLogout")?.addEventListener("click", doLogout);
  document.getElementById("topPreview")?.addEventListener("click", goPreview);
  document.getElementById("topLogout")?.addEventListener("click", doLogout);
  // Mobile drawer
  const menuBtn = document.getElementById("menuBtn");
  const drawer = document.getElementById("drawerOverlay");
  if (menuBtn) menuBtn.onclick = () => drawer.classList.toggle("hidden");
  document.querySelectorAll("[data-close-drawer]").forEach(el => el.addEventListener("click", () => drawer.classList.add("hidden")));
  document.getElementById("drawerPreview")?.addEventListener("click", goPreview);
  document.getElementById("drawerLogout")?.addEventListener("click", doLogout);
  // View-specific bindings
  const t = state.adminTab;
  if (t === "overview") bindOverview();
  else if (t === "navbar") bindNavbar();
  else if (t === "profile") bindProfile();
  else if (t === "projects") bindProjects();
  else if (t === "skills") bindSkills();
  else if (t === "experience") bindExperience();
  else if (t === "sections") bindSections();
  else if (t === "settings") bindSettings();
}

function bindOverview() {
  document.getElementById("ovPreview")?.addEventListener("click", () => { state.view="public"; render(); });
  document.getElementById("ovViewAll")?.addEventListener("click", () => { state.adminTab="projects"; render(); });
}

function bindNavbar() {
  const nb = state.data.navbar;
  document.getElementById("nbBrand").oninput = (e) => { nb.brand = e.target.value; writeData(state.data); };
  document.getElementById("nbShowBrand").onchange = (e) => { nb.showBrand = e.target.checked; writeData(state.data); };
  document.getElementById("nbSticky").onchange = (e) => { nb.sticky = e.target.checked; writeData(state.data); };
  document.getElementById("nbAdd").onclick = () => { nb.links.push({ id: genId("nav"), label: "New link", href: "#" }); writeData(state.data); render(); };
  document.querySelectorAll("[data-nav-label]").forEach(i => i.oninput = (e) => { const id = e.target.getAttribute("data-nav-label"); const l = nb.links.find(x=>x.id===id); if (l) { l.label = e.target.value; writeData(state.data); } });
  document.querySelectorAll("[data-nav-href]").forEach(i => i.oninput = (e) => { const id = e.target.getAttribute("data-nav-href"); const l = nb.links.find(x=>x.id===id); if (l) { l.href = e.target.value; writeData(state.data); } });
  document.querySelectorAll("[data-nav-del]").forEach(b => b.onclick = (e) => { const id = e.currentTarget.getAttribute("data-nav-del"); nb.links = nb.links.filter(x=>x.id!==id); writeData(state.data); render(); });
  document.querySelectorAll("[data-nav-up]").forEach(b => b.onclick = (e) => { const id = e.currentTarget.getAttribute("data-nav-up"); reorderNavLink(id, -1); });
  document.querySelectorAll("[data-nav-down]").forEach(b => b.onclick = (e) => { const id = e.currentTarget.getAttribute("data-nav-down"); reorderNavLink(id, 1); });
}
function reorderNavLink(id, dir) {
  const links = state.data.navbar.links;
  const i = links.findIndex(l=>l.id===id), j = i+dir;
  if (i<0 || j<0 || j>=links.length) return;
  [links[i], links[j]] = [links[j], links[i]];
  writeData(state.data); render();
}

function bindProfile() {
  const p = state.data.profile;
  ["pfName","pfTitle","pfTagline","pfBio","pfLoc","pfResume","pfAvatar"].forEach(id => {
    document.getElementById(id).oninput = (e) => {
      const map = { pfName:"name", pfTitle:"title", pfTagline:"tagline", pfBio:"bio", pfLoc:"location", pfResume:"resumeUrl", pfAvatar:"avatarUrl" };
      p[map[id]] = e.target.value;
    };
  });
  document.getElementById("pfSave").onclick = () => { writeDataImmediate(state.data); toast("Profile saved", "", "success"); render(); };
  document.getElementById("pfAddSocial").onclick = () => { p.socialLinks.push({ name:"New link", url:"https://" }); writeData(state.data); render(); };
  document.querySelectorAll("[data-social-name]").forEach(i => i.oninput = (e) => { p.socialLinks[+e.target.getAttribute("data-social-name")].name = e.target.value; });
  document.querySelectorAll("[data-social-url]").forEach(i => i.oninput = (e) => { p.socialLinks[+e.target.getAttribute("data-social-url")].url = e.target.value; });
  document.querySelectorAll("[data-social-del]").forEach(b => b.onclick = (e) => { const idx = +e.currentTarget.getAttribute("data-social-del"); p.socialLinks.splice(idx,1); writeData(state.data); render(); });
}

function bindProjects() {
  document.getElementById("prAdd").onclick = () => openProjectForm(null);
  document.querySelectorAll("[data-pr-edit]").forEach(b => b.onclick = (e) => { const id = e.currentTarget.getAttribute("data-pr-edit"); openProjectForm(findProject(id)); });
  document.querySelectorAll("[data-pr-del]").forEach(b => b.onclick = (e) => { const id = e.currentTarget.getAttribute("data-pr-del"); confirmDialog("Delete project?", `This will permanently remove <strong>${esc(findProject(id).title)}</strong> from your portfolio.`, "Delete", () => { state.data.projects = state.data.projects.filter(p=>p.id!==id); writeDataImmediate(state.data); toast("Project deleted", "", "error"); render(); }); });
}

function bindSkills() {
  document.getElementById("skAdd").onclick = () => { state.data.skills.push({ id: genId("skill"), category:"New category", items:[] }); writeData(state.data); render(); };
  document.querySelectorAll("[data-sk-cat]").forEach(i => i.oninput = (e) => { const id = e.target.getAttribute("data-sk-cat"); const g = state.data.skills.find(x=>x.id===id); if (g) { g.category = e.target.value; writeData(state.data); } });
  document.querySelectorAll("[data-sk-del]").forEach(b => b.onclick = (e) => { const id = e.currentTarget.getAttribute("data-sk-del"); state.data.skills = state.data.skills.filter(x=>x.id!==id); writeData(state.data); toast("Skill group deleted", "", "error"); render(); });
  state.data.skills.forEach(g => bindSkillTags(g));
}
function bindSkillTags(g) {
  const wrap = document.getElementById("skTags-"+g.id);
  if (!wrap) return;
  const input = document.createElement("input"); input.placeholder = g.items.length ? "" : "Type a skill, press Enter…"; input.style.height = "28px";
  function renderChips() {
    [...wrap.querySelectorAll(".chip")].forEach(c=>c.remove());
    g.items.forEach((t,idx) => {
      const chip = document.createElement("span"); chip.className = "chip"; chip.innerHTML = `${esc(t)}<span class="x" data-idx="${idx}">${icon("x").replace('width="20"','width="12"').replace('height="20"','height="12"')}</span>`;
      wrap.insertBefore(chip, input);
      chip.querySelector(".x").onclick = () => { g.items.splice(idx,1); writeData(state.data); renderChips(); };
    });
  }
  input.onkeydown = (e) => {
    if (e.key==="Enter" || e.key===",") { e.preventDefault(); const v = input.value.trim(); if (v && !g.items.includes(v)) { g.items.push(v); writeData(state.data); renderChips(); } input.value=""; }
    else if (e.key==="Backspace" && !input.value && g.items.length) { g.items.pop(); writeData(state.data); renderChips(); }
  };
  input.onblur = () => { const v = input.value.trim(); if (v && !g.items.includes(v)) { g.items.push(v); writeData(state.data); renderChips(); } input.value=""; };
  wrap.appendChild(input);
  renderChips();
}

function bindExperience() {
  document.getElementById("exAdd").onclick = () => { state.data.experience.unshift({ id: genId("exp"), role:"New role", company:"Company", period:"2024 — Present", description:"", current:false }); writeData(state.data); render(); };
  ["role","company","period","desc"].forEach(f => {
    document.querySelectorAll(`[data-ex-${f}]`).forEach(i => i.oninput = (e) => { const id = e.target.getAttribute(`data-ex-${f}`); const it = state.data.experience.find(x=>x.id===id); if (it) { it[f] = e.target.value; writeData(state.data); } });
  });
  document.querySelectorAll("[id^='ex-cur-']").forEach(cb => cb.onchange = (e) => { const id = cb.id.replace("ex-cur-",""); const it = state.data.experience.find(x=>x.id===id); if (it) { it.current = e.target.checked; writeData(state.data); } });
  document.querySelectorAll("[data-ex-del]").forEach(b => b.onclick = (e) => { const id = e.currentTarget.getAttribute("data-ex-del"); state.data.experience = state.data.experience.filter(x=>x.id!==id); writeData(state.data); toast("Experience deleted", "", "error"); render(); });
}

function bindSections() {
  const s = state.data.sections;
  SECTION_META.forEach(m => {
    const cb = document.getElementById("sec-en-"+m.key);
    if (cb) cb.onchange = (e) => { s[m.key].enabled = m.lock ? true : e.target.checked; writeData(state.data); render(); };
  });
  document.querySelectorAll("[data-sec-eyebrow]").forEach(i => i.oninput = (e) => { const k = e.target.getAttribute("data-sec-eyebrow"); s[k].eyebrow = e.target.value; writeData(state.data); });
  document.querySelectorAll("[data-sec-title]").forEach(i => i.oninput = (e) => { const k = e.target.getAttribute("data-sec-title"); s[k].title = e.target.value; writeData(state.data); });
  document.querySelectorAll("[data-sec-subtitle]").forEach(i => i.oninput = (e) => { const k = e.target.getAttribute("data-sec-subtitle"); s[k].subtitle = e.target.value; writeData(state.data); });
  // Contact
  const c = state.data.contact;
  document.getElementById("ctEmail").oninput = (e) => { c.email = e.target.value; writeData(state.data); };
  document.getElementById("ctPhone").oninput = (e) => { c.phone = e.target.value; writeData(state.data); };
  document.getElementById("ctCta").oninput = (e) => { c.cta = e.target.value; writeData(state.data); };
  document.getElementById("ctBlurb").oninput = (e) => { c.blurb = e.target.value; writeData(state.data); };
}

function bindSettings() {
  document.getElementById("credForm").onsubmit = async (e) => {
    e.preventDefault();
    const u = document.getElementById("setUser").value.trim();
    const p = document.getElementById("setPass").value;
    const c = document.getElementById("setConfirm").value;
    if (!u) { toast("Username required", "", "error"); return; }
    if (p.length < 4) { toast("Password too short", "Use at least 4 characters.", "error"); return; }
    if (p !== c) { toast("Passwords do not match", "", "error"); return; }
    state.data.auth = { username: u, passwordHash: await sha256(p) };
    await writeDataImmediate(state.data); toast("Credentials updated", "", "success"); render();
  };
  document.getElementById("setExport").onclick = () => {
    const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = `portfolio-cms-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast("Export ready", "JSON backup downloaded.", "success");
  };
  document.getElementById("setImport").onclick = () => document.getElementById("setFile").click();
  document.getElementById("setFile").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { const txt = await f.text(); const parsed = JSON.parse(txt); state.data = heal(parsed); await writeDataImmediate(state.data); toast("Import successful", `${state.data.projects.length} projects loaded.`, "success"); render(); }
    catch { toast("Import failed", "The file is not a valid backup.", "error"); }
    e.target.value = "";
  };
  document.getElementById("setReset").onclick = () => confirmDialog("Reset all data?", "This wipes your profile, projects, and credentials, restoring the original demo content. This cannot be undone.", "Reset", async () => { await clearData(); state.data = await buildDefaultData(); await writeDataImmediate(state.data); toast("Reset to defaults", "", "success"); render(); });
}

/* ---------- Confirm dialog ---------- */
function confirmDialog(title, desc, confirmText, onConfirm) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-overlay" id="cfOverlay"><div class="modal" style="max-width:440px;position:relative;">
    <div class="modal-head" style="padding:24px 24px 0;"><div class="flex items-center gap-2"><span style="width:36px;height:36px;border-radius:12px;background:var(--rose-soft);color:var(--rose);display:flex;align-items:center;justify-content:center;">${icon("shield")}</span><h2 class="modal-title">${title}</h2></div><p class="modal-desc">${desc}</p></div>
    <div class="modal-foot"><button class="btn btn-outline" id="cfCancel">Cancel</button><button class="btn btn-danger" id="cfOk">${icon("trash")}${confirmText}</button></div></div></div>`;
  document.getElementById("cfCancel").onclick = () => { root.innerHTML = ""; };
  document.getElementById("cfOverlay").addEventListener("click", (e) => { if (e.target.id==="cfOverlay") root.innerHTML=""; });
  document.getElementById("cfOk").onclick = () => { root.innerHTML = ""; onConfirm(); };
}

/* ============================================================
   BOOT
   ============================================================ */
async function init() {
  let cached = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) cached = heal(JSON.parse(raw));
  } catch {}
  if (cached) {
    state.data = cached;
    const session = readSession();
    state.isAdmin = session;
    if (session) state.view = "admin";
    render();
  }

  let data = await readData();
  if (!data) {
    data = cached || await buildDefaultData();
    await writeDataImmediate(data);
  }
  state.data = data;
  const session = readSession();
  state.isAdmin = session;
  if (session) state.view = "admin";
  render();

  subscribeFirestore();

  // Keyboard shortcut: Ctrl+Shift+A or Alt+L → open login
  window.addEventListener("keydown", (e) => {
    if (state.isAdmin) return;
    const csA = (e.ctrlKey||e.metaKey) && e.shiftKey && (e.key==="A"||e.key==="a");
    const aL = e.altKey && (e.key==="l"||e.key==="L");
    if (csA || aL) { e.preventDefault(); if (state.view==="public") openLogin(); }
  });
}
init();
</script>
